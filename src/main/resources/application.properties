spring.application.name=execution-service
server.port=${SERVER_PORT:8083}

# Required: no defaults outside the local/test profiles (see application-local.properties).
# Passwords follow the same rule: they come from the environment, never from this file.
app.environment=${APP_ENVIRONMENT}
app.jwt.secret=${APP_JWT_SECRET}

# MongoDB of this service. Spring Boot 4 reads spring.mongodb.* (spring.data.mongodb.* connection
# keys are deprecated). Defaults match the mongo service of the platform docker-compose.yml.
spring.mongodb.host=${SPRING_MONGODB_HOST:localhost}
spring.mongodb.port=${SPRING_MONGODB_PORT:27017}
spring.mongodb.database=${SPRING_MONGODB_DATABASE:execution}
spring.mongodb.username=${SPRING_MONGODB_USERNAME:execution}
spring.mongodb.password=${MONGODB_PASSWORD:}
spring.mongodb.authentication-database=${SPRING_MONGODB_AUTHENTICATION_DATABASE:admin}

# RabbitMQ of the platform (Service rabbitmq in the cluster, docker-compose locally).
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:oficina}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=/

# Actuator: only health, with Kubernetes probes. Readiness proves database and broker connectivity.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.group.readiness.include=readinessState,mongo,rabbit

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
