# Banco exclusivo do Execution Service (MongoDB, o NoSQL da plataforma). A senha é a mesma
# chave que a aplicação usa (MONGODB_PASSWORD do Secret execution-service-secrets).
# Autenticação ligada: o entrypoint da imagem cria o usuário root "execution" no banco admin
# na primeira inicialização do volume (mesmo contrato do docker-compose.yml da plataforma).
apiVersion: v1
kind: Service
metadata:
  name: execution-mongo
  labels:
    app.kubernetes.io/name: execution-mongo
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: execution-mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: execution-mongo
  labels:
    app.kubernetes.io/name: execution-mongo
    app.kubernetes.io/component: database
spec:
  serviceName: execution-mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-mongo
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        # Usuário mongodb (uid/gid 999) da imagem oficial.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongo
          image: mongo:8.0.34
          imagePullPolicy: IfNotPresent
          # Cache do WiredTiger limitado: o padrão (metade da memória menos 1 GB) não cabe no limite.
          args: ["--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: execution
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: execution-service-secrets
                  key: MONGODB_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: execution
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # ping não exige autenticação; o mongosh (Node.js) demora a abrir, daí o timeout maior.
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--norc", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: configdb
              mountPath: /data/configdb
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: configdb
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: execution-mongo
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
